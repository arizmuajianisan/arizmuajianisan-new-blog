name: dependabot-auto-merge

# Auto-merge low-risk Dependabot PRs (minor + patch, including grouped and
# GitHub Actions bumps). Merging is *queued* with `--auto`, so branch
# protection still gates it on the `ci` check (lint + typecheck + build).
# Major bumps are excluded and left for manual review — for grouped PRs,
# fetch-metadata reports the largest bump in the group, so any group that
# contains a major will not auto-merge.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor and patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-minor' || steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
